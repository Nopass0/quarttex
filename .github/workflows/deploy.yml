name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy installation script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "."
          target: "/home/quattrex"
          strip_components: 0
          overwrite: true
          rm: true
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/quattrex
            
            # Ensure SSL certificates are ready
            echo "🔐 Checking SSL certificates..."
            if [ -f "ssl/ensure-fullchain.sh" ]; then
              bash ssl/ensure-fullchain.sh
            fi
            
            # Fix nginx configuration
            echo "🔧 Исправляем конфигурацию nginx..."
            if [ -f "nginx/fix-nginx-config.sh" ]; then
              bash nginx/fix-nginx-config.sh
            else
              echo "⚠️ Скрипт исправления nginx не найден, создаем базовую конфигурацию"
              # Remove all configs to avoid conflicts
              rm -f nginx/conf.d/default.conf
              rm -f nginx/conf.d/default-http-only.conf
              rm -f nginx/conf.d/app.conf
              
              # Create clean HTTP-only config
              echo "⚠️ Creating clean HTTP-only config"
              echo "# Upstream definitions" > nginx/conf.d/default.conf
              echo "upstream frontend {" >> nginx/conf.d/default.conf
              echo "    server frontend:3000;" >> nginx/conf.d/default.conf
              echo "}" >> nginx/conf.d/default.conf
              echo "" >> nginx/conf.d/default.conf
              echo "upstream backend {" >> nginx/conf.d/default.conf
              echo "    server backend:3001;" >> nginx/conf.d/default.conf
              echo "}" >> nginx/conf.d/default.conf
              echo "" >> nginx/conf.d/default.conf
              echo "# HTTP server" >> nginx/conf.d/default.conf
              echo "server {" >> nginx/conf.d/default.conf
              echo "    listen 80;" >> nginx/conf.d/default.conf
              echo "    server_name _;" >> nginx/conf.d/default.conf
              echo "    " >> nginx/conf.d/default.conf
              echo "    location / {" >> nginx/conf.d/default.conf
              echo "        proxy_pass http://frontend;" >> nginx/conf.d/default.conf
              echo "        proxy_set_header Host \$host;" >> nginx/conf.d/default.conf
              echo "        proxy_set_header X-Real-IP \$remote_addr;" >> nginx/conf.d/default.conf
              echo "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" >> nginx/conf.d/default.conf
              echo "        proxy_set_header X-Forwarded-Proto \$scheme;" >> nginx/conf.d/default.conf
              echo "    }" >> nginx/conf.d/default.conf
              echo "    " >> nginx/conf.d/default.conf
              echo "    location /api/ {" >> nginx/conf.d/default.conf
              echo "        proxy_pass http://backend/api/;" >> nginx/conf.d/default.conf
              echo "        proxy_set_header Host \$host;" >> nginx/conf.d/default.conf
              echo "        proxy_set_header X-Real-IP \$remote_addr;" >> nginx/conf.d/default.conf
              echo "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" >> nginx/conf.d/default.conf
              echo "        proxy_set_header X-Forwarded-Proto \$scheme;" >> nginx/conf.d/default.conf
              echo "    }" >> nginx/conf.d/default.conf
              echo "}" >> nginx/conf.d/default.conf
            fi
            
            # Remove old containers and images
            echo "🧹 Cleaning up old containers and images..."
            docker compose -f docker-compose.prod.yml down --remove-orphans || true
            docker system prune -f || true
            
            # Create .env file for docker-compose
            echo "🔧 Creating .env file for docker-compose..."
            echo "DATABASE_URL=$DATABASE_URL" > .env
            echo "JWT_SECRET=$JWT_SECRET" >> .env
            echo "NODE_ENV=production" >> .env
            echo "POSTGRES_USER=$POSTGRES_USER" >> .env
            echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
            echo "POSTGRES_DB=$POSTGRES_DB" >> .env
            echo "POSTGRES_HOST=$POSTGRES_HOST" >> .env
            echo "POSTGRES_PORT=$POSTGRES_PORT" >> .env
            echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> .env
            echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL" >> .env

            # Verify .env file was created
            echo "🔍 Verifying .env file..."
            if [ -f ".env" ]; then
              echo "✅ .env file created successfully"
              echo "📋 DATABASE_URL is set: $(grep -q 'DATABASE_URL=' .env && echo 'YES' || echo 'NO')"
            else
              echo "❌ Failed to create .env file!"
              exit 1
            fi

            # Build and start services
            echo "🚀 Building and starting services..."
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to be ready..."
            sleep 30
            
            # Check if containers are running
            echo "🔍 Checking container status..."
            if ! docker ps | grep -q "backend\|frontend\|nginx"; then
              echo "❌ Some containers failed to start"
              docker ps -a
              exit 1
            fi
            
            # Fix nginx configuration inside container
            echo "🔧 Исправляем конфигурацию nginx внутри контейнера..."
            
            # Remove ALL nginx config files except app.conf (HTTPS config)
            docker exec nginx bash -c "rm -f /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default-http-only.conf /etc/nginx/conf.d/*.backup /etc/nginx/conf.d/*.bak"
            
            # Also remove conflicting configs from the host, keep only app.conf
            rm -f nginx/conf.d/default.conf nginx/conf.d/default-http-only.conf nginx/conf.d/*.backup nginx/conf.d/*.bak
            
            # Ensure app.conf exists and is properly configured
            echo "🔧 Проверяем конфигурацию app.conf..."
            if [ ! -f "nginx/conf.d/app.conf" ]; then
              echo "❌ app.conf не найден! Это критическая ошибка."
              exit 1
            else
              echo "✅ app.conf найден, используем существующую HTTPS конфигурацию"
            fi
            
            # Restart nginx container
            echo "🔄 Перезапускаем nginx контейнер..."
            docker restart nginx || echo "⚠️ Не удалось перезапустить nginx"
            sleep 10
            
            # Run auto-fix migrations inside backend container
            echo "🔧 Running auto-fix migrations..."
            if [ -f "backend/scripts/auto-fix-migrations.sh" ]; then
              docker exec backend bash scripts/auto-fix-migrations.sh || \
                echo "⚠️ Auto-fix completed with warnings"
            fi
            
            # Final verification
            echo "🔍 Final verification..."
            docker exec backend bunx prisma migrate status || \
              echo "⚠️ Migration status check completed with warnings"
            
            # Check if critical tables exist
            echo "📋 Checking critical tables..."
            docker exec backend bunx prisma db execute --stdin <<< \
              "SELECT COUNT(*) FROM \"Merchant\";" || \
              echo "⚠️ Merchant table check completed with warnings"
            docker exec backend bunx prisma db execute --stdin <<< \
              "SELECT COUNT(*) FROM \"Method\";" || \
              echo "⚠️ Method table check completed with warnings"
            docker exec backend bunx prisma db execute --stdin <<< \
              "SELECT COUNT(*) FROM \"User\";" || \
              echo "⚠️ User table check completed with warnings"
            docker exec backend bunx prisma db execute --stdin <<< \
              "SELECT COUNT(*) FROM \"Aggregator\";" || \
              echo "⚠️ Aggregator table check completed with warnings"
            
            echo "✅ Deployment completed successfully!"
            
            # Show running containers
            echo "📦 Running containers:"
            docker ps
            
            # Check environment variables in backend container
            echo "🔍 Checking environment variables in backend container..."
            docker exec backend printenv | grep -E "(DATABASE_URL|JWT_SECRET|NODE_ENV)" || \
              echo "⚠️ Some environment variables are missing"

            # Show service health
            echo "🏥 Service health:"
            docker exec backend curl -f http://localhost:3001/api/health || \
              echo "⚠️ Backend health check failed"
            docker exec frontend curl -f http://localhost:3000 || \
              echo "⚠️ Frontend health check failed"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}