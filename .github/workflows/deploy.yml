name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Переходим в каталог проекта
          cd $PROJECT_PATH
          
          # Клонируем/обновляем репозиторий если нужно
          if [ ! -d ".git" ]; then
            echo "📦 Клонируем репозиторий..."
            rm -rf * .* 2>/dev/null || true
            git clone https://github.com/Nopass0/quarttex.git .
          fi
          
          # Останавливаем старые контейнеры
          echo "🔄 Останавливаем старые контейнеры..."
          sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true
          
          # Принудительно удаляем старые контейнеры если они остались
          echo "🧹 Принудительно очищаем старые контейнеры..."
          sudo docker rm -f quattrex_backend quattrex_frontend quattrex_nginx 2>/dev/null || true
          
          # Очищаем неиспользуемые образы
          echo "🧹 Очищаем неиспользуемые образы..."
          sudo docker image prune -f || true
          
          # Обновляем код
          echo "📥 Обновляем код..."
          git fetch origin
          git reset --hard origin/main
          
          # Проверяем что код обновился
          echo "🔍 Проверяем версию кода..."
          git log --oneline -3
          
          # Создаем .env файл
          echo "⚙️ Создаем .env файл..."
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "NODE_ENV=production" >> .env
          echo "SUPER_ADMIN_KEY=$SUPER_ADMIN_KEY" >> .env
          echo "ADMIN_IPS=127.0.0.1" >> .env
          
          # Очищаем старые nginx конфиги (если есть)
          echo "🧹 Очищаем старые nginx конфигурации..."
          rm -f nginx/conf.d/default-http-only.conf 2>/dev/null || true
          rm -f nginx/conf.d/app.conf 2>/dev/null || true
          rm -f nginx/conf.d/default.conf 2>/dev/null || true
          echo "Старые nginx конфигурации очищены"
          
          # Проверяем SSL сертификаты
          echo "🔐 Проверяем SSL сертификаты..."
          if [ -f "/quattrex/ssl/certificate.crt" ]; then
            echo "✅ Найден certificate.crt"
            openssl x509 -in /quattrex/ssl/certificate.crt -noout -dates || echo "⚠️  Проблема с certificate.crt"
          else
            echo "❌ certificate.crt не найден"
          fi
          
          if [ -f "/quattrex/ssl/certificate.key" ]; then
            echo "✅ Найден certificate.key"
          else
            echo "❌ certificate.key не найден"
          fi
          
          # Собираем и запускаем новые контейнеры
          echo "🚀 Собираем и запускаем новые контейнеры..."
          if sudo docker compose -f docker-compose.prod.yml up -d --build --force-recreate; then
            echo "✅ Контейнеры успешно запущены"
          else
            echo "❌ Ошибка при запуске контейнеров"
            sudo docker compose -f docker-compose.prod.yml logs --tail=50
            exit 1
          fi
          
          # Ждем запуска
          echo "⏳ Ждем запуска сервисов..."
          sleep 30
          
          # Проверяем статус
          echo "🔍 Проверяем статус контейнеров..."
          sudo docker ps
          
          # Проверяем логи nginx если есть проблемы
          echo "📋 Последние логи nginx..."
          sudo docker logs quattrex_nginx --tail=20 || echo "Не удалось получить логи nginx"
          
          # Проверяем API
          echo "🔍 Тестируем API..."
          sleep 10
          
          # Сначала проверяем HTTP
          if curl -f -H "x-admin-key: $SUPER_ADMIN_KEY" http://quattrex.pro/health; then
            echo "✅ HTTP health check passed"
          else
            echo "❌ HTTP health check failed"
          fi
          
          # Затем HTTPS
          if curl -k -f -H "x-admin-key: $SUPER_ADMIN_KEY" https://quattrex.pro/api/admin/rate-sources; then
            echo "✅ HTTPS API test passed"
          else
            echo "❌ HTTPS API test failed"
            # Показываем дополнительные логи при ошибке
            sudo docker logs quattrex_backend --tail=20
            sudo docker logs quattrex_nginx --tail=20
          fi
          
          echo "✅ Деплой завершен!"
      env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_KEY: ${{ secrets.SUPER_ADMIN_KEY }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}