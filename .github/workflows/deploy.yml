name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Copy installation script to server
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "."
          target: "/home/quattrex"
          strip_components: 0
          overwrite: true
          rm: true
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /home/quattrex
            
            # Ensure SSL certificates are ready
            echo "🔐 Checking SSL certificates..."
            if [ -f "ssl/ensure-fullchain.sh" ]; then
              bash ssl/ensure-fullchain.sh
            fi
            
            # Check if we have SSL certificates
            if [ -f "ssl/certificate.crt" ] && [ -f "ssl/fullchain.crt" ]; then
              echo "✅ SSL certificates found, using HTTPS configuration"
              # Use HTTPS configuration
              if [ -f "nginx/conf.d/app.conf" ]; then
                cp nginx/conf.d/app.conf nginx/conf.d/default.conf
                rm -f nginx/conf.d/default-http-only.conf
              fi
            else
              echo "⚠️ SSL certificates not found, using HTTP-only configuration"
              # Remove the HTTPS config and use HTTP-only
              rm -f nginx/conf.d/default.conf
              if [ -f "nginx/conf.d/default-http-only.conf" ]; then
              cp nginx/conf.d/default-http-only.conf nginx/conf.d/default.conf
              rm -f nginx/conf.d/default-http-only.conf
              else
                echo "⚠️ HTTP-only config not found, creating basic config"
                echo "server {" > nginx/conf.d/default.conf
                echo "    listen 80;" >> nginx/conf.d/default.conf
                echo "    server_name _;" >> nginx/conf.d/default.conf
                echo "    location / {" >> nginx/conf.d/default.conf
                echo "        proxy_pass http://frontend:3000;" >> nginx/conf.d/default.conf
                echo "        proxy_set_header Host \$host;" >> nginx/conf.d/default.conf
                echo "        proxy_set_header X-Real-IP \$remote_addr;" >> nginx/conf.d/default.conf
                echo "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" >> nginx/conf.d/default.conf
                echo "        proxy_set_header X-Forwarded-Proto \$scheme;" >> nginx/conf.d/default.conf
                echo "    }" >> nginx/conf.d/default.conf
                echo "    location /api/ {" >> nginx/conf.d/default.conf
                echo "        proxy_pass http://backend:3001/api/;" >> nginx/conf.d/default.conf
                echo "        proxy_set_header Host \$host;" >> nginx/conf.d/default.conf
                echo "        proxy_set_header X-Real-IP \$remote_addr;" >> nginx/conf.d/default.conf
                echo "        proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;" >> nginx/conf.d/default.conf
                echo "        proxy_set_header X-Forwarded-Proto \$scheme;" >> nginx/conf.d/default.conf
                echo "    }" >> nginx/conf.d/default.conf
                echo "}" >> nginx/conf.d/default.conf
              fi
            fi
            
            # Remove old containers and images
            $DOCKER_CMD compose -f docker-compose.prod.yml rm -f
            $DOCKER_CMD image prune -f
            
            # Build and start services
            echo "🚀 Building and starting services..."
            $DOCKER_CMD compose -f docker-compose.prod.yml up -d --build
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to be ready..."
            sleep 30
            
            # Run auto-fix migrations inside backend container
            echo "🔧 Running auto-fix migrations..."
            if [ -f "backend/scripts/auto-fix-migrations.sh" ]; then
              $DOCKER_CMD exec backend bash scripts/auto-fix-migrations.sh || echo "⚠️ Auto-fix completed with warnings"
            fi
            
            # Final verification
            echo "🔍 Final verification..."
            $DOCKER_CMD exec backend bunx prisma migrate status || echo "⚠️ Migration status check completed with warnings"
            
            # Check if critical tables exist
            echo "📋 Checking critical tables..."
            $DOCKER_CMD exec backend bunx prisma db execute --stdin <<< "SELECT COUNT(*) FROM \"Merchant\";" || echo "⚠️ Merchant table check completed with warnings"
            $DOCKER_CMD exec backend bunx prisma db execute --stdin <<< "SELECT COUNT(*) FROM \"Method\";" || echo "⚠️ Method table check completed with warnings"
            $DOCKER_CMD exec backend bunx prisma db execute --stdin <<< "SELECT COUNT(*) FROM \"User\";" || echo "⚠️ User table check completed with warnings"
            $DOCKER_CMD exec backend bunx prisma db execute --stdin <<< "SELECT COUNT(*) FROM \"Aggregator\";" || echo "⚠️ Aggregator table check completed with warnings"
            
            echo "✅ Deployment completed successfully!"
            
            # Show running containers
            echo "📦 Running containers:"
            $DOCKER_CMD ps
            
            # Show service health
            echo "🏥 Service health:"
            $DOCKER_CMD exec backend curl -f http://localhost:3001/api/health || echo "⚠️ Backend health check failed"
            $DOCKER_CMD exec frontend curl -f http://localhost:3000 || echo "⚠️ Frontend health check failed"
        env:
          DOCKER_CMD: docker
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: production
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}