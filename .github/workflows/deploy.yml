name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        password: ${{ secrets.SERVER_PASSWORD }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Переходим в каталог проекта
          cd $PROJECT_PATH
          
          # Клонируем/обновляем репозиторий если нужно
          if [ ! -d ".git" ]; then
            echo "📦 Клонируем репозиторий..."
            rm -rf * .* 2>/dev/null || true
            git clone https://github.com/Nopass0/quarttex.git .
          fi
          
          # Останавливаем старые контейнеры
          echo "🔄 Останавливаем старые контейнеры..."
          sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true
          
          # Обновляем код
          echo "📥 Обновляем код..."
          git fetch origin
          git reset --hard origin/main
          
          # Проверяем что код обновился
          echo "🔍 Проверяем версию кода..."
          git log --oneline -3
          
          # Создаем .env файл
          echo "⚙️ Создаем .env файл..."
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "NODE_ENV=production" >> .env
          echo "SUPER_ADMIN_KEY=$SUPER_ADMIN_KEY" >> .env
          echo "ADMIN_IPS=127.0.0.1" >> .env
          
          # Очищаем старые nginx конфиги (если есть)
          echo "🧹 Очищаем старые nginx конфигурации..."
          if [ -f "nginx/conf.d/default-http-only.conf" ]; then
            rm -f nginx/conf.d/default-http-only.conf
            echo "Удален старый default-http-only.conf"
          fi
          if [ -f "nginx/conf.d/app.conf" ] && [ -f "nginx/conf.d/quattrex.conf" ]; then
            rm -f nginx/conf.d/app.conf
            echo "Удален старый app.conf"
          fi
          
          # Собираем и запускаем новые контейнеры
          echo "🚀 Собираем и запускаем новые контейнеры..."
          sudo docker compose -f docker-compose.prod.yml up -d --build --force-recreate
          
          # Ждем запуска
          echo "⏳ Ждем запуска сервисов..."
          sleep 30
          
          # Проверяем статус
          echo "🔍 Проверяем статус контейнеров..."
          sudo docker ps
          
          # Проверяем API
          echo "🔍 Тестируем API..."
          sleep 10
          curl -k -H "x-admin-key: $SUPER_ADMIN_KEY" https://quattrex.pro/api/admin/rate-sources || echo "API test failed"
          
          echo "✅ Деплой завершен!"
      env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SUPER_ADMIN_KEY: ${{ secrets.SUPER_ADMIN_KEY }}
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}