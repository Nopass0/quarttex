name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        password: ${{ secrets.PASSWORD }}
        port: ${{ secrets.PORT }}
        script: |
          cd /home/quattrex
          
          # Останавливаем старые контейнеры
          echo "�� Останавливаем старые контейнеры..."
          sudo docker compose -f docker-compose.prod.yml down --remove-orphans || true
          
          # Обновляем код
          echo "📥 Обновляем код..."
          git fetch origin
          git reset --hard origin/main
          
          # Проверяем что код обновился
          echo "🔍 Проверяем версию кода..."
          git log --oneline -3
          
          # Создаем .env файл
          echo "�� Создаем .env файл..."
          echo "DATABASE_URL=$DATABASE_URL" > .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "NODE_ENV=production" >> .env
          echo "POSTGRES_USER=$POSTGRES_USER" >> .env
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env
          echo "POSTGRES_DB=$POSTGRES_DB" >> .env
          echo "POSTGRES_HOST=$POSTGRES_HOST" >> .env
          echo "POSTGRES_PORT=$POSTGRES_PORT" >> .env
          echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" >> .env
          echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL" >> .env
          echo "SUPER_ADMIN_KEY=$SUPER_ADMIN_KEY" >> .env
          echo "ADMIN_IPS=$ADMIN_IPS" >> .env
          
          # Собираем и запускаем новые контейнеры
          echo "🚀 Собираем и запускаем новые контейнеры..."
          sudo docker compose -f docker-compose.prod.yml up -d --build --force-recreate
          
          # Ждем запуска
          echo "⏳ Ждем запуска сервисов..."
          sleep 30
          
          # Проверяем статус
          echo "🔍 Проверяем статус контейнеров..."
          sudo docker ps
          
          # Проверяем API
          echo "🔍 Тестируем API..."
          sleep 10
          curl -k -H "x-admin-key: $SUPER_ADMIN_KEY" https://quattrex.pro/api/admin/rate-sources || echo "API test failed"
          
          echo "✅ Деплой завершен!"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUPER_ADMIN_KEY: ${{ secrets.SUPER_ADMIN_KEY }}
          ADMIN_IPS: ${{ secrets.ADMIN_IPS }}
