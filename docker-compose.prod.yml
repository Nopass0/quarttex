services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: quattrex_backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://neondb_owner:npg_QUjnlT5zcFg3@ep-broad-shadow-a21mjc86-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this}
      - NODE_ENV=production
      - PORT=3001
      - SUPER_ADMIN_KEY=${SUPER_ADMIN_KEY:-}
      - ADMIN_IPS=${ADMIN_IPS:-}
      - NODE_OPTIONS=--max-old-space-size=4096
    expose:
      - "3001"
    networks:
      - quattrex_network
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/uploads
    mem_limit: 8g
    mem_reservation: 2g
    cpus: '4.0'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://quattrex.pro/api
    container_name: quattrex_frontend
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=2048"
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - quattrex_network
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g
    cpus: '2.0'

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: quattrex_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /quattrex/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    networks:
      - quattrex_network
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    cpus: '1.0'

networks:
  quattrex_network:
    driver: bridge